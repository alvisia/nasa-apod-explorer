<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASA API Pictures</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      href="https://s2.googleusercontent.com/s2/favicons?domain=www.nasa.gov"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- ZTM Favicon -->
    <!-- <link rel="icon" type="image/png" href="favicon.png"> -->
    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.6/dist/axios.min.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <!-- Error Message -->
    <div class="error-container hidden" id="error-container">
      <p class="error-message" role="alert">
        Unable to load NASA images. Please try again.
      </p>
    </div>
    <!-- Loader -->
    <div class="loader hidden">
      <img src="rocket.svg" alt="Rocket Loading Animation" />
    </div>
    <!-- Container -->
    <div class="container">
      <!-- Navigation -->
      <div class="navigation-container">
        <h1 class="main-title">Cosmic Explorer</h1>
        <!-- Results Nav -->
        <div class="navigation-items" id="resultsNav">
          <button class="clickable" id="favorites-btn">Favorites</button>

          <p class="nav-divider" aria-hidden="true">
            &nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;
          </p>

          <button class="clickable" id="explore-btn">Explore More</button>
        </div>
        <div class="search-date-container">
          <input
            type="date"
            class="input-date"
            id="input-date"
            aria-label="Search by date"
          />
          <button class="search-date" id="search-date" title="Search Date">
            Search
          </button>
        </div>

        <!-- Favorites Nav -->
        <div class="navigation-items hidden" id="favoritesNav">
          <button class="clickable" id="back-to-explore-btn">
            Back to Explore
          </button>
        </div>
      </div>
      <div class="empty-message-container hidden" id="empty-message-container">
        <h2 class="empty-message-title">No favorites saved yet.</h2>
        <p class="empty-message-text">
          Explore NASA images and save your favorites here.
        </p>
      </div>
      <!-- Images Container -->
      <div class="images-container"></div>
    </div>
    <!-- Save Confirmation -->
    <div class="save-confirmed" aria-live="polite" hidden>
      <p>Saved to Favorites</p>
    </div>
  </body>
</html>
